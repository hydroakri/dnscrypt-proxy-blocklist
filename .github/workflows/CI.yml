# This GitHub Actions workflow fetches and merges blocklists on a schedule
# using the `generate-domains-blocklist.py` from the official dnscrypt-proxy repository.
#
# It builds two DNS-domain variants (big + mini) in four formats each (dnscrypt-proxy
# plain text, sing-box JSON/SRS, Unbound RPZ), plus a merged ABP/uBO-syntax filter
# list (`ubo-filterlist.txt`, via @adguard/hostlist-compiler and `ubo-sources.json`)
# for use as a uBlock Origin subscription. It only cuts a new release /
# force-pushes the `release` branch / purges the CDN / commits state.json
# when any of these generated sets actually changed since the last run.

name: Update Blocklist

on:
  schedule:
    # Runs at 0:00 UTC every day (8:00 AM SGT)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a release even if nothing changed'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        run: |
          echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "SERIAL=$(date +%s)" >> $GITHUB_ENV
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout dnscrypt-proxy tools
        uses: actions/checkout@v4
        with:
          repository: 'DNSCrypt/dnscrypt-proxy'
          path: 'dnscrypt-proxy'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # If your script requires extra libraries, install them here

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate merged blocklist (big)
        run: |
          # Ensure domains-blocklist.conf, allowlist and time-restricted files are in the repo root
          python dnscrypt-proxy/utils/generate-domains-blocklist/generate-domains-blocklist.py \
            --config domains-blocklist.conf \
            --time-restricted domains-time-restricted.txt \
            --allowlist domains-allowlist.txt \
            --output-file blocklist.txt

      - name: Generate merged blocklist (mini)
        run: |
          python dnscrypt-proxy/utils/generate-domains-blocklist/generate-domains-blocklist.py \
            --config domains-blocklist-mini.conf \
            --time-restricted domains-time-restricted.txt \
            --allowlist domains-allowlist.txt \
            --output-file blocklist-mini.txt

      - name: Report mini list size
        run: |
          echo "blocklist-mini.txt size:"
          du -h blocklist-mini.txt

      - name: Fetch previous uBO filter list (fallback)
        run: |
          # Seeds ubo-filterlist.txt with the last published version so the release
          # branch always has a copy, even if today's regeneration below fails.
          curl -fsSL -o ubo-filterlist.txt \
            "https://raw.githubusercontent.com/${{ github.repository }}/release/ubo-filterlist.txt" \
            || echo "No previously published ubo-filterlist.txt (first run?)"

      - name: Generate uBO filter list
        id: ubo
        continue-on-error: true
        run: |
          npx --yes @adguard/hostlist-compiler@2.1.1 -c ubo-sources.json -o ubo-filterlist.txt.new

      - name: Validate uBO filter list
        id: ubo_validate
        run: |
          if [ "${{ steps.ubo.outcome }}" = "success" ] && [ -s ubo-filterlist.txt.new ]; then
            mv ubo-filterlist.txt.new ubo-filterlist.txt
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::uBO filter list generation failed or produced an empty file; keeping previous ubo-filterlist.txt (source list unchanged this run)"
            rm -f ubo-filterlist.txt.new
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changes
        id: diff
        run: |
          NEW_BIG=$(sha256sum blocklist.txt | cut -d' ' -f1)
          NEW_MINI=$(sha256sum blocklist-mini.txt | cut -d' ' -f1)
          OLD_BIG=$(jq -r '.big // ""' state.json)
          OLD_MINI=$(jq -r '.mini // ""' state.json)
          OLD_UBO=$(jq -r '.ubo // ""' state.json)

          if [ "${{ steps.ubo_validate.outputs.ok }}" = "true" ]; then
            NEW_UBO=$(sha256sum ubo-filterlist.txt | cut -d' ' -f1)
          else
            NEW_UBO="$OLD_UBO"
          fi

          echo "new_big=$NEW_BIG" >> "$GITHUB_OUTPUT"
          echo "new_mini=$NEW_MINI" >> "$GITHUB_OUTPUT"
          echo "new_ubo=$NEW_UBO" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event.inputs.force }}" = "true" ] || [ "$NEW_BIG" != "$OLD_BIG" ] || [ "$NEW_MINI" != "$OLD_MINI" ] || [ "$NEW_UBO" != "$OLD_UBO" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Convert blocklists to sing-box JSON
        if: steps.diff.outputs.changed == 'true'
        run: |
          cat << 'EOF' > convert_to_srs.py
          import json
          import sys

          input_file = sys.argv[1]
          output_file = sys.argv[2]

          domains = set()
          domain_suffixes = set()

          with open(input_file, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue

                  # strip dnscrypt-proxy's optional time-restriction suffix (e.g. "domain @tag")
                  domain = line.split("@")[0].strip()

                  # dnscrypt-proxy prefixes: "*." / "*" = domain + subdomains, "=" = exact match only
                  if domain.startswith("*."):
                      domain_suffixes.add(domain[2:])
                  elif domain.startswith("*"):
                      domain_suffixes.add(domain[1:])
                  elif domain.startswith("="):
                      domains.add(domain[1:])
                  else:
                      domain_suffixes.add(domain)

          rules = []
          if domains:
              rules.append({"domain": sorted(domains)})
          if domain_suffixes:
              rules.append({"domain_suffix": sorted(domain_suffixes)})

          # version: 1 is broadest client compat; version: 2 is smaller but needs sing-box 1.10.0+
          srs_json = {
              "version": 1,
              "rules": rules
          }

          with open(output_file, "w", encoding="utf-8") as f:
              json.dump(srs_json, f, indent=2)
          EOF
          python convert_to_srs.py blocklist.txt blocklist.json
          python convert_to_srs.py blocklist-mini.txt blocklist-mini.json

      - name: Convert blocklists to Unbound RPZ
        if: steps.diff.outputs.changed == 'true'
        run: |
          cat << 'EOF' > convert_to_rpz.py
          import sys

          input_file = sys.argv[1]
          output_file = sys.argv[2]
          serial = sys.argv[3]

          exact_domains = set()
          suffix_domains = set()

          with open(input_file, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue

                  # strip dnscrypt-proxy's optional time-restriction suffix; RPZ has no time-window
                  # mechanism so these are blocked unconditionally, same as the sing-box conversion.
                  domain = line.split("@")[0].strip()

                  if domain.startswith("*."):
                      suffix_domains.add(domain[2:])
                  elif domain.startswith("*"):
                      suffix_domains.add(domain[1:])
                  elif domain.startswith("="):
                      exact_domains.add(domain[1:])
                  else:
                      suffix_domains.add(domain)

          lines = [
              "$TTL 60",
              "@ IN SOA localhost. admin.localhost. (",
              f"    {serial} ; serial",
              "    3600      ; refresh",
              "    600       ; retry",
              "    86400     ; expire",
              "    60        ; minimum",
              ")",
              "@ IN NS localhost.",
              "",
          ]

          for domain in sorted(exact_domains):
              lines.append(f"{domain} CNAME .")

          for domain in sorted(suffix_domains):
              lines.append(f"{domain} CNAME .")
              lines.append(f"*.{domain} CNAME .")

          with open(output_file, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          EOF
          python convert_to_rpz.py blocklist.txt blocklist.rpz "$SERIAL"
          python convert_to_rpz.py blocklist-mini.txt blocklist-mini.rpz "$SERIAL"

      - name: Install sing-box CLI
        if: steps.diff.outputs.changed == 'true'
        run: |
          # 使用官方脚本自动拉取并安装最新版 sing-box 的命令行工具
          bash <(curl -fsSL https://sing-box.app/install.sh)

      - name: Compile to sing-box SRS format
        if: steps.diff.outputs.changed == 'true'
        run: |
          sing-box rule-set compile --output blocklist.srs blocklist.json
          sing-box rule-set compile --output blocklist-mini.srs blocklist-mini.json

      - name: Prepare publish directory
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p publish
          cp blocklist.txt blocklist.json blocklist.srs blocklist.rpz publish/
          cp blocklist-mini.txt blocklist-mini.json blocklist-mini.srs blocklist-mini.rpz publish/
          cp ubo-filterlist.txt publish/

      - name: Release and upload assets
        if: steps.diff.outputs.changed == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}
          file_glob: true
          file: ./publish/*

      - name: Git push assets to release branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          cd publish
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "${{ github.actor }}@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release

      - name: Purge jsDelivr CDN
        if: steps.diff.outputs.changed == 'true'
        run: |
          cd publish
          for file in *; do
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${file}"
          done

      - name: Commit updated state.json
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "{\"big\": \"${{ steps.diff.outputs.new_big }}\", \"mini\": \"${{ steps.diff.outputs.new_mini }}\", \"ubo\": \"${{ steps.diff.outputs.new_ubo }}\"}" > state.json
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update state.json (${{ env.TAG_NAME }})" || echo "Nothing to commit"
          git push
