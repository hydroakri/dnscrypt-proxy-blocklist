# Mini list: DNS-level equivalents of the filter lists enabled by default in
# Vanadium, Brave, Mullvad Browser, LibreWolf and Trivalent (Tor has none).
# Preference order per source: maintainer's own hosts/domain export, then a
# transparent third-party derived export. Lists that exist only as ABP/uBO
# syntax (uBlock filters, cookie lists, Brave lists, Bulgarian, Latvian, RoList,
# ABPVN, Serbo-Croatian, AdGuard Japanese/Dutch, URL-parameter lists) are NOT
# converted: their rules rely on paths, options and exceptions that a
# domain-level block cannot express and would cause false positives.
# Use ubo-filterlist.txt in a browser/uBO for those.

## URLhaus / Online Malicious URL Blocklist (Brave, Mullvad, LibreWolf) - maintainer's hosts export
https://curbengh.github.io/malware-filter/urlhaus-filter-hosts.txt
## Phishing URL Blocklist (LibreWolf) - maintainer's hosts export
https://curbengh.github.io/malware-filter/phishing-filter-hosts.txt
## Peter Lowe's list (Mullvad, LibreWolf) - maintainer's plain-domain export
https://pgl.yoyo.org/adservers/serverlist.php?hostformat=nohtml&showintro=0&mimetype=plaintext
## smed79/easylist-hosts - third-party hosts conversion of EasyList, EasyPrivacy (all browsers except Tor), Fanboy Annoyance and Adblock Warning Removal (Trivalent/Vanadium), and EasyList DE/IT/ES/PT/PL/FR/AR/RU/KR/IN/CN/CZ-SK (Vanadium/Trivalent). Also pulls in Turkish, Persian, Spam404, global-filters, ABP Dutch/Japanese, which browsers do not enable by default
https://raw.githubusercontent.com/smed79/easylist-hosts/main/hosts
## 217heidai/adblockfilters - third-party aggregate (lite, ~8.5k domains) covering AdGuard Chinese (Brave zh), EasyList China, CJX Annoyance; also merges other upstreams
https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockhostslite.txt
